<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FitSmarter</title>
<meta name="description" content="Track workouts, close your rings and compete with friends on weekly leaderboards.">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitSmarter">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="welcome" hidden></div>

<div id="app" hidden>
  <header class="top"><div class="top-in">
    <span class="brand"><img src="logo.svg" alt="">FitSmarter</span>
    <span class="sp"></span>
    <button class="pill ghost sm" id="installBtn" hidden type="button">Install</button>
    <a href="#me" class="avatar" id="topAvatar" aria-label="Profile"></a>
  </div></header>

  <main>
    <div class="banner" id="demoBanner" hidden><span>🧪</span><div><b>Demo mode.</b> Sample friends, data stays on this phone. Connect Firebase to compete for real.</div></div>

    <section class="view" id="v-today" aria-labelledby="t-today">
      <div class="title"><div><small id="todayDate"></small><h1 id="t-today">Today</h1></div></div>
      <div class="card"><div class="rings" id="rings"></div></div>
      <div class="card" id="rankCard"></div>
      <div class="card"><h3>This week <span class="r" id="weekPts"></span></h3><div class="bars" id="bars"></div></div>
      <div class="tiles" id="tiles"></div>
      <div class="card"><h3>Recent <a class="r" href="#me" style="text-decoration:none;color:var(--accent)">All</a></h3><div class="list" id="recent"></div></div>
    </section>

    <section class="view" id="v-feed" aria-labelledby="t-feed">
      <div class="title"><h1 id="t-feed">Feed</h1></div>
      <div class="groups" id="feedGroups"></div>
      <div id="feed" style="display:flex;flex-direction:column;gap:14px"></div>
    </section>

    <section class="view" id="v-record" aria-labelledby="t-record">
      <div class="title"><h1 id="t-record">Record</h1></div>
      <div class="card"><h3>Activity</h3><div class="types" id="types"></div></div>
      <div class="card" style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center">
        <p class="muted" id="recHint"></p>
        <button class="startbtn" id="startBtn" type="button"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>Start</button>
        <button class="pill ghost" id="manualBtn" type="button">Log manually</button>
      </div>
    </section>

    <section class="view" id="v-compete" aria-labelledby="t-compete">
      <div class="title"><h1 id="t-compete">Compete</h1><div class="row"><button class="pill ghost sm" id="joinBtn" type="button">Join</button><button class="pill primary sm" id="newGroupBtn" type="button">New group</button></div></div>
      <div class="groups" id="compGroups"></div>
      <div id="compete" style="display:flex;flex-direction:column;gap:14px"></div>
    </section>

    <section class="view" id="v-me" aria-labelledby="t-me">
      <div class="card" style="display:flex;gap:16px;align-items:center"><span class="avatar lg" id="meAvatar"></span><div style="min-width:0"><h1 id="t-me" style="font-size:28px"></h1><small class="muted" id="meSince"></small></div></div>
      <div class="tiles" id="meTiles"></div>
      <div class="card"><h3>Badges <span class="r" id="badgeCount"></span></h3><div class="badges" id="badges"></div></div>
      <div class="card"><h3>Your activities</h3><div class="list" id="history"></div></div>
      <div class="card"><h3>Goals &amp; profile</h3>
        <form id="profileForm" style="display:flex;flex-direction:column;gap:12px">
          <div class="field"><label for="pName">Name</label><input id="pName" maxlength="40" required></div>
          <div class="grid2">
            <div class="field"><label for="pMove">Move goal (kcal/day)</label><input id="pMove" type="number" min="100" max="3000" step="10" inputmode="numeric"></div>
            <div class="field"><label for="pEx">Exercise goal (min/day)</label><input id="pEx" type="number" min="5" max="300" step="5" inputmode="numeric"></div>
            <div class="field"><label for="pKm">Distance goal (km/day)</label><input id="pKm" type="number" min="0.5" max="100" step="0.5" inputmode="decimal"></div>
            <div class="field"><label for="pW">Weight (kg, for calories)</label><input id="pW" type="number" min="30" max="250" step="1" inputmode="numeric"></div>
          </div>
          <button class="pill primary block" type="submit">Save</button>
        </form>
      </div>
      <div class="card" id="accountCard"></div>
    </section>
  </main>

  <nav class="tabs" aria-label="Sections"><div class="tabs-in">
    <a href="#today" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>Today</a>
    <a href="#feed" data-v="feed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Feed</a>
    <a href="#record" data-v="record" class="rec" aria-label="Record"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></a>
    <a href="#compete" data-v="compete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Compete</a>
    <a href="#me" data-v="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>You</a>
  </div></nav>
</div>

<script type="module" src="app.js"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
